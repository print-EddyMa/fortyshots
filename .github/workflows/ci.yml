# Tests, lint, the published-number check and a repository size guard.
# Pushing this file to GitHub needs a token with the `workflow` scope (gh auth refresh -s workflow).
# The website does not depend on it: Pages deploys from the branch main, folder /docs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Repository size guard (no file over 50 MB, tracked total under 500 MB)
        run: |
          big="$(git ls-files -z | xargs -0 -r stat -c '%s %n' | awk '$1 > 50 * 1024 * 1024')"
          if [ -n "$big" ]; then echo "Files over 50 MB:"; echo "$big"; exit 1; fi
          total="$(git ls-files -z | xargs -0 -r stat -c '%s' | awk '{ s += $1 } END { print s + 0 }')"
          echo "tracked bytes: $total"
          if [ "$total" -gt $((500 * 1024 * 1024)) ]; then echo "Tracked files exceed 500 MB"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and the package
        run: |
          python -m pip install --quiet uv
          uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          shellcheck -s bash lab tests/test_lab.sh

      - name: Tests (includes ./lab end to end with the mock model)
        run: uv run pytest -q

      - name: Recompute every published number
        run: |
          if [ -f results/results.json ]; then uv run fortyshots verify; else echo "no results/results.json yet"; fi
