[project]
name = "fortyshots"
version = "0.1.0"
description = "An offline AI lab that decides which expensive experiment to run next. Muse Glimmer 30B on a laptop, scored against Meta FAIR ODAC23 DFT."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fortyshots = "fortyshots.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortyshots", "bench"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
